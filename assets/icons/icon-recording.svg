<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Video frame -->
  <rect x="2" y="4" width="15" height="16" rx="2"/>
  <!-- Play/record triangle -->
  <polygon points="22 12 17 8.5 17 15.5" fill="none"/>
  <!-- Eye in the viewfinder (the recording eye) -->
  <ellipse cx="9.5" cy="11" rx="3.5" ry="2.2"/>
  <circle cx="9.5" cy="11" r="1.2" fill="none"/>
  <circle cx="9.5" cy="11" r="0.5" fill="#00B894" stroke="none"/>
  <!-- Recording indicator -->
  <circle cx="5" cy="7" r="1" fill="#D63031" stroke="#D63031" stroke-width="0.5"/>
  <!-- Timeline -->
  <line x1="2" y1="22" x2="22" y2="22" opacity="0.3"/>
  <line x1="2" y1="22" x2="14" y2="22" stroke-width="2"/>
</svg>
