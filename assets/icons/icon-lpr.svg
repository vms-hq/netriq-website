<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- License plate -->
  <rect x="2" y="8" width="20" height="10" rx="2"/>
  <!-- Plate text lines -->
  <line x1="6" y1="13" x2="18" y2="13"/>
  <line x1="8" y1="15.5" x2="16" y2="15.5" opacity="0.5" stroke-width="1"/>
  <!-- Eye scanning from above (reading the plate) -->
  <ellipse cx="12" cy="4" rx="3.5" ry="2"/>
  <circle cx="12" cy="4" r="1" fill="none"/>
  <circle cx="12" cy="4" r="0.5" fill="#00B894" stroke="none"/>
  <!-- Scan beam lines from eye to plate -->
  <line x1="9" y1="5.5" x2="5" y2="8" stroke-dasharray="1 1" opacity="0.35" stroke-width="0.8"/>
  <line x1="15" y1="5.5" x2="19" y2="8" stroke-dasharray="1 1" opacity="0.35" stroke-width="0.8"/>
</svg>
