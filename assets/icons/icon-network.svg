<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#00B894" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Central eye node (the all-seeing hub) -->
  <ellipse cx="12" cy="12" rx="4" ry="2.5"/>
  <circle cx="12" cy="12" r="1" fill="#00B894" stroke="none"/>
  <!-- Outer site nodes -->
  <circle cx="4" cy="5" r="1.5"/>
  <circle cx="20" cy="5" r="1.5"/>
  <circle cx="4" cy="19" r="1.5"/>
  <circle cx="20" cy="19" r="1.5"/>
  <!-- Connection lines from eye to sites -->
  <line x1="5.2" y1="6.2" x2="9" y2="10.5"/>
  <line x1="18.8" y1="6.2" x2="15" y2="10.5"/>
  <line x1="5.2" y1="17.8" x2="9" y2="13.5"/>
  <line x1="18.8" y1="17.8" x2="15" y2="13.5"/>
</svg>
