<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="6" fill="#2D3436"/>

  <!-- Compact intelligent eye for favicon -->
  <g>
    <!-- Eye almond -->
    <path d="M 4,16 C 7,9 11,6 16,6 C 21,6 25,9 28,16 C 25,23 21,26 16,26 C 11,26 7,23 4,16 Z"
          stroke="#00B894" stroke-width="1.5" fill="none"/>
    <!-- Iris -->
    <circle cx="16" cy="16" r="6" stroke="#00B894" stroke-width="1" fill="none" opacity="0.7"/>
    <!-- Cardinal circuit ticks -->
    <line x1="16" y1="10" x2="16" y2="12" stroke="#00B894" stroke-width="0.7" opacity="0.5"/>
    <line x1="16" y1="20" x2="16" y2="22" stroke="#00B894" stroke-width="0.7" opacity="0.5"/>
    <line x1="10" y1="16" x2="12" y2="16" stroke="#00B894" stroke-width="0.7" opacity="0.5"/>
    <line x1="20" y1="16" x2="22" y2="16" stroke="#00B894" stroke-width="0.7" opacity="0.5"/>
    <!-- Pupil -->
    <circle cx="16" cy="16" r="3" fill="#2D3436" stroke="#00B894" stroke-width="0.8"/>
    <!-- Glowing core -->
    <circle cx="16" cy="16" r="1.5" fill="#00B894" filter="url(#glow)"/>
  </g>
</svg>
