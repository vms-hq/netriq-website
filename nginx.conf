server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long cache on hashed assets / images / fonts
    location ~* \.(svg|png|jpg|jpeg|webp|woff2?|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # HTML pages — short cache, revalidate
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Security & noise
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    # Gzip is on by default in nginx:alpine; ensure for text types
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 256;
}
